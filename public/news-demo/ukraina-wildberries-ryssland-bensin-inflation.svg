<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" fill="none" aria-hidden="true">
  <!-- DivLab editorial cover: logistics warehouse + fuel pressure motif -->
  <rect width="1600" height="900" fill="#12161C"/>

  <!-- Subtle logistics grid -->
  <g stroke="rgba(255,255,255,0.045)" stroke-width="1">
    <path d="M0 150 H1600M0 300 H1600M0 450 H1600M0 600 H1600M0 750 H1600"/>
    <path d="M200 0 V900M400 0 V900M600 0 V900M800 0 V900M1000 0 V900M1200 0 V900M1400 0 V900"/>
  </g>

  <!-- Soft European continent silhouette -->
  <path
    d="M980 210 C1010 180 1060 175 1105 195 C1145 170 1200 185 1225 220 C1270 210 1315 240 1310 285 C1345 310 1335 360 1295 380 C1275 430 1210 445 1160 420 C1110 455 1040 440 1015 395 C970 390 945 345 955 300 C940 260 955 225 980 210 Z"
    fill="rgba(10,132,255,0.08)"
    stroke="rgba(10,132,255,0.22)"
    stroke-width="2"
  />
  <circle cx="1120" cy="300" r="4" fill="rgba(10,132,255,0.45)"/>
  <circle cx="1185" cy="265" r="3" fill="rgba(10,132,255,0.35)"/>
  <circle cx="1240" cy="320" r="3" fill="rgba(10,132,255,0.3)"/>
  <path d="M1120 300 L1185 265 L1240 320" stroke="rgba(10,132,255,0.28)" stroke-width="1.5" stroke-dasharray="4 5"/>

  <!-- Orange fire / smoke glow behind warehouse (solid layered shapes, no gradient) -->
  <ellipse cx="620" cy="430" rx="260" ry="140" fill="rgba(232,93,42,0.14)"/>
  <ellipse cx="640" cy="400" rx="160" ry="90" fill="rgba(232,93,42,0.22)"/>
  <ellipse cx="655" cy="385" rx="70" ry="48" fill="rgba(255,140,66,0.28)"/>
  <path d="M560 360 C575 300 610 250 640 210 C655 260 680 300 710 340 C690 300 760 270 780 240 C770 310 750 360 720 400 Z" fill="rgba(120,128,140,0.28)"/>
  <path d="M600 350 C615 290 650 240 675 200 C690 250 715 300 740 345 C755 300 780 270 800 245 C790 320 770 365 740 395 Z" fill="rgba(90,98,110,0.22)"/>

  <!-- Warehouse silhouette -->
  <g fill="#0B0E13">
    <path d="M220 520 L520 360 L820 520 V760 H220 Z"/>
    <rect x="250" y="530" width="70" height="95" fill="#1A222C"/>
    <rect x="350" y="530" width="70" height="95" fill="#1A222C"/>
    <rect x="450" y="530" width="70" height="95" fill="#1A222C"/>
    <rect x="550" y="530" width="70" height="95" fill="#1A222C"/>
    <rect x="650" y="530" width="70" height="95" fill="#1A222C"/>
    <rect x="300" y="655" width="90" height="105" fill="#151B24"/>
    <path d="M220 520 L520 360 L820 520" stroke="rgba(255,255,255,0.08)" stroke-width="3"/>
  </g>
  <!-- Damaged roof edge / broken bay -->
  <path d="M480 390 L540 420 L560 395 L610 430" stroke="rgba(232,93,42,0.55)" stroke-width="4" stroke-linecap="round"/>
  <rect x="500" y="470" width="55" height="70" fill="rgba(232,93,42,0.18)"/>

  <!-- Ground plane -->
  <rect x="0" y="760" width="1600" height="140" fill="#0E1218"/>
  <path d="M0 760 H1600" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>

  <!-- Fuel pump silhouette in foreground -->
  <g transform="translate(1120,470)">
    <rect x="40" y="40" width="150" height="250" rx="10" fill="#1A222C" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
    <rect x="60" y="70" width="110" height="70" rx="6" fill="#0B0E13" stroke="rgba(10,132,255,0.35)" stroke-width="2"/>
    <!-- Price bars symbol -->
    <rect x="78" y="90" width="18" height="36" fill="rgba(232,93,42,0.85)"/>
    <rect x="106" y="78" width="18" height="48" fill="rgba(232,93,42,0.7)"/>
    <rect x="134" y="98" width="18" height="28" fill="rgba(232,93,42,0.55)"/>
    <rect x="70" y="160" width="90" height="14" rx="3" fill="rgba(255,255,255,0.1)"/>
    <rect x="70" y="190" width="90" height="14" rx="3" fill="rgba(255,255,255,0.07)"/>
    <rect x="70" y="220" width="60" height="14" rx="3" fill="rgba(255,255,255,0.05)"/>
    <!-- Hose and nozzle -->
    <path d="M190 120 C230 120 245 160 245 200" stroke="rgba(255,255,255,0.28)" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M245 200 L245 250 L270 250" stroke="rgba(255,255,255,0.35)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="262" y="238" width="36" height="24" rx="4" fill="#2A3340"/>
    <!-- Base -->
    <rect x="20" y="290" width="190" height="18" rx="4" fill="#151B24"/>
  </g>

  <!-- Frame -->
  <rect x="1" y="1" width="1598" height="898" rx="0" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>
</svg>

name: Autoredaktion Branch Preflight

on:
  push:
    branches:
      - "autoredaktion/borssverige-*"
      - "autoredaktion/norden-i-centrum-*"
      - "autoredaktion/bolaget-i-fokus-*"
      - "autoredaktion/usa-i-fokus-*"

concurrency:
  group: autoredaktion-preflight-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  statuses: write
  issues: write
  pull-requests: write

jobs:
  prepare-and-preflight:
    name: Prepare image and validate before PR
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout publication branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Classify branch event before publication work
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^autoredaktion/(borssverige|norden-i-centrum|bolaget-i-fokus|usa-i-fokus)-[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Unsupported Autoredaktion branch: $GITHUB_REF_NAME" >&2
            exit 1
          fi

          git fetch origin main --no-tags
          base_sha="$(git rev-parse origin/main)"
          head_sha="$(git rev-parse HEAD)"
          merge_base="$(git merge-base "$base_sha" "$head_sha")"
          changed_files="$(git diff --name-only "$merge_base"..."$head_sha")"
          existing_prs="$(gh pr list --state all --base main --head "$GITHUB_REF_NAME" --limit 1 --json number --jq 'length')"

          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "AUTOREDAKTION_BASE_SHA=$base_sha" >> "$GITHUB_ENV"
          echo "AUTOREDAKTION_BRANCH_NAME=$GITHUB_REF_NAME" >> "$GITHUB_ENV"

          if [[ "$existing_prs" != "0" ]]; then
            echo "mode=frozen" >> "$GITHUB_OUTPUT"
            echo "Managed PR already exists; branch is frozen and this push receives no preflight status or mutation."
            exit 0
          fi

          if [[ -z "$changed_files" ]]; then
            echo "mode=empty" >> "$GITHUB_OUTPUT"
            echo "No branch-side publication diff exists; branch-create event is neutral."
            exit 0
          fi

          echo "mode=candidate" >> "$GITHUB_OUTPUT"
          if ! git merge-base --is-ancestor "$base_sha" "$head_sha"; then
            echo "Publication branch is stale relative to current main. Refresh before PR creation." >&2
            exit 1
          fi

      - name: Setup Node.js
        if: steps.candidate.outputs.mode == 'candidate'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        if: steps.candidate.outputs.mode == 'candidate'
        run: npm ci

      - name: Validate initial path, P0 and history contracts
        if: steps.candidate.outputs.mode == 'candidate'
        shell: bash
        run: |
          set -euo pipefail
          npm run autoredaktion:validate-history
          npm run autoredaktion:validate-candidate

      - name: Deterministic one-time preparation
        if: steps.candidate.outputs.mode == 'candidate'
        shell: bash
        run: |
          set -euo pipefail
          if git log --format=%s "$AUTOREDAKTION_BASE_SHA"..HEAD | grep -Fq '[autoredaktion-prepared]'; then
            echo "Preparation marker already exists; no second preparation commit is allowed."
          else
            AUTOREDAKTION_BASE_SHA="$AUTOREDAKTION_BASE_SHA" npm run autoredaktion:prepare-branch
            git add -- data/news-articles public/news/generated
            if ! git diff --cached --quiet; then
              unexpected="$(git diff --cached --name-only | grep -Ev '^(data/news-articles/(borssverige|norden-i-centrum|bolaget-i-fokus|usa-i-fokus)-.+\.ts|public/news/generated/(borssverige|norden-i-centrum|bolaget-i-fokus|usa-i-fokus)-[0-9]{4}-[0-9]{2}-[0-9]{2}\.png)$' || true)"
              if [[ -n "$unexpected" ]]; then
                echo "Preparation touched unexpected files:" >&2
                echo "$unexpected" >&2
                exit 1
              fi
              git config user.name "divlab-autoredaktion"
              git config user.email "actions@users.noreply.github.com"
              git commit -m "chore(autoredaktion): [autoredaktion-prepared] normalize article and render cover"
              git push origin "HEAD:$GITHUB_REF_NAME"
            fi
          fi
          echo "AUTOREDAKTION_PREPARED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Revalidate bounded history after preparation
        if: steps.candidate.outputs.mode == 'candidate'
        shell: bash
        run: |
          set -euo pipefail
          AUTOREDAKTION_HEAD_SHA="$(git rev-parse HEAD)" npm run autoredaktion:validate-history

      - name: Exact pre-PR gates
        if: steps.candidate.outputs.mode == 'candidate'
        shell: bash
        run: |
          set -euo pipefail
          AUTOREDAKTION_BASE_SHA="$AUTOREDAKTION_BASE_SHA" npm run autoredaktion:preflight

      - name: Ensure managed PR label exists
        if: steps.candidate.outputs.mode == 'candidate'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh api "repos/$GITHUB_REPOSITORY/labels/autoredaktion" >/dev/null 2>&1; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/labels" \
              -f name='autoredaktion' \
              -f color='0A84FF' \
              -f description='Fail-closed managed DivLab Autoredaktion publication'
          fi

      - name: Mark prepared head safe to open PR
        if: steps.candidate.outputs.mode == 'candidate'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$AUTOREDAKTION_PREPARED_HEAD" \
            -f state='success' \
            -f context='autoredaktion/preflight' \
            -f description='Pre-PR typecheck, validators and image gates passed'

      - name: Mark preflight failure on current head
        if: failure() && steps.candidate.outputs.mode == 'candidate'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          sha="$(git rev-parse HEAD 2>/dev/null || echo "$GITHUB_SHA")"
          git fetch origin main --no-tags >/dev/null 2>&1
          main_sha="$(git rev-parse origin/main 2>/dev/null || true)"
          if [[ -n "$main_sha" && "$sha" == "$main_sha" ]]; then
            echo "Refusing to write Autoredaktion failure status on current main SHA $sha."
            exit 0
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$sha" \
            -f state='failure' \
            -f context='autoredaktion/preflight' \
            -f description='Pre-PR gate failed; do not open or merge a publication PR'

      - name: Ensure one managed draft PR and Quality Gate handoff
        if: >
          steps.candidate.outputs.mode == 'candidate' ||
          steps.candidate.outputs.mode == 'frozen'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          head="$(git rev-parse HEAD)"
          preflight_state="$(gh api "repos/$GITHUB_REPOSITORY/commits/$head/status" \
            --jq '[.statuses[] | select(.context == "autoredaktion/preflight")] | sort_by(.updated_at) | last.state // ""')"
          if [[ "$preflight_state" != "success" ]]; then
            echo "No managed handoff: exact head $head lacks successful autoredaktion/preflight status."
            exit 0
          fi

          mapfile -t matches < <(gh pr list --state all --base main --head "$GITHUB_REF_NAME" \
            --limit 10 --json number --jq '.[].number')
          if (( ${#matches[@]} > 1 )); then
            echo "Expected at most one managed PR for $GITHUB_REF_NAME; found ${#matches[@]}." >&2
            exit 1
          fi

          created_pr=false
          if (( ${#matches[@]} == 0 )); then
            series="${GITHUB_REF_NAME#autoredaktion/}"
            date="${series: -10}"
            series="${series:0:${#series}-11}"
            case "$series" in
              borssverige) title="BörsSverige – $date" ;;
              norden-i-centrum) title="Norden i centrum – $date" ;;
              bolaget-i-fokus) title="Bolaget i fokus – $date" ;;
              usa-i-fokus) title="USA i fokus – $date" ;;
              *)
                echo "Unsupported managed series in $GITHUB_REF_NAME." >&2
                exit 1
                ;;
            esac

            gh pr create \
              --base main \
              --head "$GITHUB_REF_NAME" \
              --draft \
              --label autoredaktion \
              --title "$title" \
              --body "<!-- AUTOREDAKTION_MANAGED_V2 -->

          Managed Autoredaktion publication prepared and validated by GitHub Actions.

          Prepared head: \`$head\`"
            created_pr=true
            mapfile -t matches < <(gh pr list --state open --base main --head "$GITHUB_REF_NAME" \
              --limit 10 --json number --jq '.[].number')
          fi

          if (( ${#matches[@]} != 1 )); then
            echo "Expected exactly one open managed PR for $GITHUB_REF_NAME; found ${#matches[@]}." >&2
            exit 1
          fi

          pr="${matches[0]}"
          gh pr view "$pr" \
            --json number,state,isDraft,headRefName,baseRefName,headRefOid,labels,files,commits,title,body \
            > /tmp/autoredaktion-pr.json
          npm run autoredaktion:pr-policy -- /tmp/autoredaktion-pr.json

          quality_runs_for_head() {
            gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/quality-gate.yml/runs" \
              -f branch="$GITHUB_REF_NAME" \
              -f per_page=20 \
              --jq "[.workflow_runs[] | select(.head_sha == \"$head\")] | length"
          }

          run_count="$(quality_runs_for_head)"
          if [[ "$created_pr" != "true" && "$run_count" == "0" ]]; then
            for _ in 1 2 3 4; do
              sleep 5
              run_count="$(quality_runs_for_head)"
              [[ "$run_count" != "0" ]] && break
            done
          fi

          if [[ "$run_count" == "0" ]]; then
            base_sha="${AUTOREDAKTION_BASE_SHA:-$(git merge-base origin/main "$head")}"
            gh workflow run quality-gate.yml \
              --ref "$GITHUB_REF_NAME" \
              -f base_sha="$base_sha" \
              -f pr_number="$pr"
            echo "Managed draft PR #$pr created/verified and Quality Gate dispatched for $head."
          else
            echo "Managed draft PR #$pr already has $run_count Quality Gate run(s) for exact head $head; no duplicate dispatch."
          fi

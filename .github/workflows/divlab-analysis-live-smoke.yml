name: DivLab Analysis Live Smoke

on:
  push:
    branches: [agent/divlab-deep-research-v1]
    paths:
      - ".github/workflows/divlab-analysis-live-smoke.yml"
      - "scripts/divlab-analysis-live-smoke.ts"

permissions:
  contents: read

jobs:
  smoke:
    name: Live read-only research smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run live read-only smoke
        run: node --import ./tests/shims/register-server-only.mjs --import tsx scripts/divlab-analysis-live-smoke.ts

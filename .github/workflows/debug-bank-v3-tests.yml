name: Debug Bank v3 Tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  debug-bank-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Bank prompt mandate test
        run: npx tsx --test --test-name-pattern "methodological prohibitions" tests/divlab-bank-analyst-prompt.test.ts
      - name: Bank prompt valuation facts test
        run: npx tsx --test --test-name-pattern "bank-appropriate valuation facts" tests/divlab-bank-analyst-prompt.test.ts
      - name: Bank prompt evidence bounding test
        run: npx tsx --test --test-name-pattern "bounded evidence" tests/divlab-bank-analyst-prompt.test.ts
      - name: Bank deep research v3 tests
        run: npx tsx --test tests/divlab-bank-deep-research.test.ts

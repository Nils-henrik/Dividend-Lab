name: Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Peer readiness test (diagnostic)
        run: npx tsx --test tests/divlab-peer-research-readiness.test.ts

      - name: Peer audit readiness test (diagnostic)
        run: npx tsx --test tests/divlab-peer-audit-peer-ready.test.ts

      - name: Peer migration contract test (diagnostic)
        run: npx tsx --test tests/divlab-peer-research-migration-contract.test.ts

      - name: Curated peer catalog test (diagnostic)
        run: npx tsx --test tests/divlab-curated-peer-catalog.test.ts

      - name: Preview peer route safety test (diagnostic)
        run: npx tsx --test tests/divlab-peer-preview-route-contract.test.ts

      - name: Legacy peer contract tests (diagnostic)
        run: npx tsx --test tests/divlab-peer-analyst-composition.test.ts tests/divlab-peer-analyst-context.test.ts tests/divlab-peer-analyst-v3.test.ts tests/divlab-peer-comparison-audit.test.ts tests/divlab-peer-comparison.test.ts tests/divlab-peer-registry-contract.test.ts tests/divlab-peer-registry-hydration.test.ts tests/divlab-peer-registry-read.test.ts

      - name: Core tests
        run: npm test

      - name: SEO and news tests
        run: npm run test:seo

      - name: DivBrain tests
        run: npm run test:divbrain

      - name: Cursor bridge tests
        run: npm run test:cursor-bridge

      - name: Production build
        run: npm run build

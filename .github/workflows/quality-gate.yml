name: Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_sha:
        description: "Base main SHA for a bounded Autoredaktion repair rerun"
        required: false
        type: string
      pr_number:
        description: "Managed Autoredaktion PR number for traceability"
        required: false
        type: string

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Detect image-relevant changes
        id: image_changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha || github.event.before }}
        shell: bash
        run: |
          base="$BASE_SHA"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          if git diff --name-only "$base"...HEAD | grep -Eq '^(lib/news/images/|scripts/autoredaktion-image|public/news/generated/|public/company-logos/|data/news-articles/(borssverige|norden-i-centrum|bolaget-i-fokus|usa-i-fokus)-|docs/automation/AUTOREDATION_V1\.md|docs/automation/AUTOREDATION_V1_1\.md|package\.json)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Validate changed autonomous articles
        env:
          AUTOREDAKTION_BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha || github.event.before }}
        run: npm run autoredaktion:validate-changed

      - name: Core tests
        run: npm test

      - name: SEO and news tests
        run: npm run test:seo

      - name: Autoredaktion image tests
        if: steps.image_changes.outputs.changed == 'true'
        run: npm run test:news-images

      - name: Autoredaktion dry-run
        run: npm run autoredaktion:dry-run

      - name: Autoredaktion image visual dry-run v2
        if: steps.image_changes.outputs.changed == 'true'
        run: npm run autoredaktion:image:dry-run

      - name: Upload image visual-review-v2 artifact
        if: steps.image_changes.outputs.changed == 'true'
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: autoredaktion-v1-1-visual-review-v2
          path: .tmp/autoredaktion-images/review-v2/**/*.png
          if-no-files-found: error
          retention-days: 7

      - name: DivBrain tests
        run: npm run test:divbrain

      - name: Cursor bridge tests
        run: npm run test:cursor-bridge

      - name: Production build
        run: npm run build

  handoff_managed_release:
    name: Handoff managed gate result
    needs: quality
    if: >
      always() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.pr_number != '' &&
      (startsWith(github.ref_name, 'autoredaktion/borssverige-') ||
      startsWith(github.ref_name, 'autoredaktion/norden-i-centrum-') ||
      startsWith(github.ref_name, 'autoredaktion/bolaget-i-fokus-') ||
      startsWith(github.ref_name, 'autoredaktion/usa-i-fokus-'))
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_BRANCH: ${{ github.ref_name }}
      HEAD_SHA: ${{ github.sha }}
      GATE_CONCLUSION: ${{ needs.quality.result }}
      PR_NUMBER: ${{ inputs.pr_number }}
    steps:
      - name: Dispatch exact gate result to Release State Machine
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run autoredaktion-release.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f head_branch="$HEAD_BRANCH" \
            -f head_sha="$HEAD_SHA" \
            -f run_conclusion="$GATE_CONCLUSION" \
            -f pr_number="$PR_NUMBER"

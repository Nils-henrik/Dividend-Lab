name: Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Detect image-relevant changes
        id: image_changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          base="$BASE_SHA"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          if git diff --name-only "$base"...HEAD | grep -Eq '^(lib/news/images/|scripts/autoredaktion-image|public/news/generated/|public/company-logos/|data/news-articles/(borssverige|norden-i-centrum)-|docs/automation/AUTOREDATION_V1\.md|package\.json)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Validate changed autonomous articles
        env:
          AUTOREDAKTION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run autoredaktion:validate-changed

      - name: Core tests
        run: npm test

      - name: SEO and news tests
        run: npm run test:seo

      - name: Autoredaktion image tests
        if: steps.image_changes.outputs.changed == 'true'
        run: npm run test:news-images

      - name: Autoredaktion dry-run
        run: npm run autoredaktion:dry-run

      - name: Autoredaktion image visual dry-run v2
        if: steps.image_changes.outputs.changed == 'true'
        run: npm run autoredaktion:image:dry-run

      - name: Upload image visual-review-v2 artifact
        if: steps.image_changes.outputs.changed == 'true'
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: autoredaktion-v1-1-visual-review-v2
          path: .tmp/autoredaktion-images/review-v2/**/*.png
          if-no-files-found: error
          retention-days: 7

      - name: DivBrain tests
        run: npm run test:divbrain

      - name: Cursor bridge tests
        run: npm run test:cursor-bridge

      - name: Production build
        run: npm run build

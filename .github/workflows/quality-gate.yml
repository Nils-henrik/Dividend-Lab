name: Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Core tests
        run: npm test

      - name: SEO and news tests
        run: npm run test:seo

      - name: DivBrain tests
        shell: bash
        run: |
          set -o pipefail
          npm run test:divbrain 2>&1 | tee divbrain-test.log

      - name: Upload DivBrain diagnostic log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: divbrain-test-log
          path: divbrain-test.log
          if-no-files-found: warn
          retention-days: 1

      - name: Cursor bridge tests
        run: npm run test:cursor-bridge

      - name: Production build
        run: npm run build
